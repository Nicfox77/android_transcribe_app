name: Verify native Android build

on:
  pull_request:
  workflow_dispatch:

jobs:
  rust-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          cargo install cargo-ndk

      - name: Compile Rust and transcribe.cpp for Android
        env:
          TRANSCRIBE_CMAKE_ARGS: -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16
        run: cargo ndk -t arm64-v8a build --release

      # Build a self-contained phone-test variant without changing the normal
      # product artifact. It bundles Unified Q4 instead of V3 and uses a
      # side-by-side package id so it can coexist with the upstream app.
      - name: Configure Unified Q4 test variant
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('app/build.gradle.kts')
          s = gradle.read_text()
          replacements = {
              'parakeet-tdt-0.6b-v3-Q4_K_M.gguf': 'parakeet-unified-en-0.6b-Q4_K_M.gguf',
              'b68557be1e3c40207fd7c4bd9d63f1d3316b963f15325bfb0cc16a8bb0ffd181': 'a8bf3de2b393bd14ead5a858c3748d5e3b07a20fdeabdd3b498fba4f463fa929',
              'https://huggingface.co/handy-computer/parakeet-tdt-0.6b-v3-gguf/resolve/main': 'https://huggingface.co/handy-computer/parakeet-unified-en-0.6b-gguf/resolve/main',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected build.gradle text: {old}')
              s = s.replace(old, new)

          marker = '    buildTypes {\n        release {'
          replacement = '''    buildTypes {
                  debug {
                      applicationIdSuffix = ".unifiedtest"
                      versionNameSuffix = "-unified-test"
                  }
                  release {'''
          if marker not in s:
              raise SystemExit('missing expected buildTypes block')
          s = s.replace(marker, replacement, 1)
          gradle.write_text(s)

          strings = Path('app/src/main/res/values/strings.xml')
          s = strings.read_text()
          s = s.replace('<string name="app_name">Offline Voice Input</string>',
                        '<string name="app_name">Offline Voice Input (Unified Test)</string>')
          s = s.replace('<string name="recognition_service_label">Offline Voice Input</string>',
                        '<string name="recognition_service_label">Offline Voice Input (Unified Test)</string>')
          s = s.replace('<string name="models_builtin">Parakeet TDT 0.6B v3</string>',
                        '<string name="models_builtin">Parakeet Unified EN 0.6B Q4</string>')
          s = s.replace('<string name="models_builtin_sub">Included in the app · 25 European languages</string>',
                        '<string name="models_builtin_sub">Included in this test build · English · streaming</string>')
          strings.write_text(s)

          assets = Path('src/assets.rs')
          s = assets.read_text()
          s = s.replace('const EXTRACTION_COMPLETE_MARKER: &str = ".extraction_complete";',
                        'const EXTRACTION_COMPLETE_MARKER: &str = ".extraction_complete_unified_q4_v1";')
          assets.write_text(s)
          PY

      - name: Build debug APK
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:assembleDebug --stacktrace

      - name: Upload Unified Q4 test APK
        uses: actions/upload-artifact@v4
        with:
          name: offline-voice-input-unified-q4-streaming
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  heliboard-inline-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HeliBoard inline voice branch
        uses: actions/checkout@v4
        with:
          repository: Nicfox77/HeliBoard
          ref: feature/parakeet-inline-voice

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build HeliBoard debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload HeliBoard inline voice APK
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-inline-voice-debug
          path: app/build/outputs/apk/debug/*-debug*.apk
          if-no-files-found: error
          retention-days: 14
