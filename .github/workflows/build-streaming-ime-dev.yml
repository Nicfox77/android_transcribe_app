name: Build streaming voice keyboard dev APK

on:
  push:
    branches:
      - feature/parakeet-unified-streaming
    paths:
      - 'src/**'
      - 'app/**'
      - 'model_assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.github/workflows/build-streaming-ime-dev.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          cargo install cargo-ndk

      - name: Configure Parakeet Unified Q4 streaming test variant
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('app/build.gradle.kts')
          s = gradle.read_text()
          replacements = {
              'parakeet-tdt-0.6b-v3-Q4_K_M.gguf': 'parakeet-unified-en-0.6b-Q4_K_M.gguf',
              'b68557be1e3c40207fd7c4bd9d63f1d3316b963f15325bfb0cc16a8bb0ffd181': 'a8bf3de2b393bd14ead5a858c3748d5e3b07a20fdeabdd3b498fba4f463fa929',
              'https://huggingface.co/handy-computer/parakeet-tdt-0.6b-v3-gguf/resolve/main': 'https://huggingface.co/handy-computer/parakeet-unified-en-0.6b-gguf/resolve/main',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected model config: {old}')
              s = s.replace(old, new)

          marker = '    buildTypes {\n        release {'
          replacement = '''    buildTypes {
                  debug {
                      applicationIdSuffix = ".streamingtest"
                      versionNameSuffix = "-unified-streaming-final-fix"
                  }
                  release {'''
          if marker not in s:
              raise SystemExit('buildTypes marker missing')
          gradle.write_text(s.replace(marker, replacement, 1))

          strings = Path('app/src/main/res/values/strings.xml')
          s = strings.read_text()
          s = s.replace(
              '<string name="app_name">Offline Voice Input</string>',
              '<string name="app_name">Offline Voice Input (Streaming Final Fix)</string>',
          )
          s = s.replace(
              '<string name="recognition_service_label">Offline Voice Input</string>',
              '<string name="recognition_service_label">Offline Voice Input (Streaming Final Fix)</string>',
          )
          s = s.replace(
              '<string name="models_builtin">Parakeet TDT 0.6B v3</string>',
              '<string name="models_builtin">Parakeet Unified EN 0.6B Q4</string>',
          )
          s = s.replace(
              '<string name="models_builtin_sub">Included in the app · 25 European languages</string>',
              '<string name="models_builtin_sub">English · streaming with final-text fallback</string>',
          )
          strings.write_text(s)
          PY

      - name: Patch streaming final-text fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/engine.rs')
          s = p.read_text()

          old_text = '                            let text = stream.text().full;\n'
          new_text = '''                            let snapshot = stream.text();
                            let text = if !snapshot.full.trim().is_empty() {
                                snapshot.full.clone()
                            } else {
                                snapshot.display()
                            };
'''
          if s.count(old_text) != 1:
              raise SystemExit(f'expected exactly one stream final text line, found {s.count(old_text)}')
          s = s.replace(old_text, new_text, 1)

          old_return = '''                            return Ok(Some(text));
                        }
                        Err(e) => {
'''
          new_return = '''                            if text.trim().is_empty() && !fallback_audio.is_empty() {
                                log::warn!("buffered stream finalized with empty text; falling back to retained PCM batch transcription");
                                drop(stream);
                                return self.transcribe(fallback_audio).map(Some);
                            }
                            return Ok(Some(text));
                        }
                        Err(e) => {
'''
          if s.count(old_return) != 1:
              raise SystemExit(f'expected exactly one stream final return block, found {s.count(old_return)}')
          p.write_text(s.replace(old_return, new_return, 1))
          PY

      - name: Build ARM64 debug APK
        env:
          TRANSCRIBE_CMAKE_ARGS: -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:assembleDebug --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" dist/Offline-Voice-Input-Unified-Streaming-final-fix.apk
          sha256sum dist/Offline-Voice-Input-Unified-Streaming-final-fix.apk \
            | tee dist/Offline-Voice-Input-Unified-Streaming-final-fix.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-voice-input-unified-streaming-final-fix
          path: |
            dist/Offline-Voice-Input-Unified-Streaming-final-fix.apk
            dist/Offline-Voice-Input-Unified-Streaming-final-fix.apk.sha256
          compression-level: 0
          retention-days: 14

      - name: Record successful APK build
        continue-on-error: true
        run: |
          mkdir -p build_status
          cat > build_status/streaming-ime-final-fix.txt <<EOF
          run_id=$GITHUB_RUN_ID
          source_commit=$GITHUB_SHA
          artifact=offline-voice-input-unified-streaming-final-fix
          apk=Offline-Voice-Input-Unified-Streaming-final-fix.apk
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_status/streaming-ime-final-fix.txt
          git commit -m "Record successful streaming IME APK build $GITHUB_RUN_ID" || exit 0
          git push origin HEAD:feature/parakeet-unified-streaming

      - name: Publish direct dev APK release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view streaming-ime-dev >/dev/null 2>&1; then
            gh release create streaming-ime-dev \
              --target "$GITHUB_SHA" \
              --title "Offline Voice Input - Unified streaming dev" \
              --prerelease \
              --notes "ARM64 Parakeet Unified streaming development build."
          fi

          gh release upload streaming-ime-dev \
            dist/Offline-Voice-Input-Unified-Streaming-final-fix.apk \
            dist/Offline-Voice-Input-Unified-Streaming-final-fix.apk.sha256 \
            --clobber
